name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test TestProject -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, osx-x64, osx-arm64]
        selfcontained: [true, false]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: |
          if [ "${{ matrix.selfcontained }}" = "true" ]; then
            dotnet publish WebGUI -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:DebugType=none -o publish/${{ matrix.rid }}
          else
            dotnet publish WebGUI -c Release -r ${{ matrix.rid }} --no-self-contained -p:PublishSingleFile=true -p:DebugType=none -o publish/${{ matrix.rid }}-fd
          fi
      - name: Set artifact name
        id: names
        run: |
          if [ "${{ matrix.selfcontained }}" = "true" ]; then
            echo "dir=publish/${{ matrix.rid }}" >> $GITHUB_OUTPUT
            echo "zip=EngineBattle-${{ matrix.rid }}.zip" >> $GITHUB_OUTPUT
            echo "artifact=EngineBattle-${{ matrix.rid }}" >> $GITHUB_OUTPUT
          else
            echo "dir=publish/${{ matrix.rid }}-fd" >> $GITHUB_OUTPUT
            echo "zip=EngineBattle-${{ matrix.rid }}-framework-dependent.zip" >> $GITHUB_OUTPUT
            echo "artifact=EngineBattle-${{ matrix.rid }}-framework-dependent" >> $GITHUB_OUTPUT
          fi
      - name: Zip
        run: cd ${{ steps.names.outputs.dir }} && zip -r ../../${{ steps.names.outputs.zip }} .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ steps.names.outputs.zip }}

  # The Windows desktop shell. Separate job because it targets net10.0-windows and needs a
  # Windows runner for the WPF markup compiler, and it is deliberately not part of
  # EngineBattle.sln so the ubuntu jobs above keep building. Ships as its own zip: unpack it
  # into the same folder as EngineBattle.exe and the shell finds the server as a sibling.
  desktop-shell:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
        selfcontained: [true, false]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish and zip
        shell: pwsh
        run: |
          $sc = '${{ matrix.selfcontained }}' -eq 'true'
          # No PublishSingleFile: WebView2 ships native libraries beside the exe.
          # Not named $args -- that is a PowerShell automatic variable.
          $publishArgs = @('publish', 'Desktop/EngineBattle.Desktop', '-c', 'Release',
                           '-r', '${{ matrix.rid }}', '-p:DebugType=none', '-o', 'publish/shell')
          $publishArgs += $(if ($sc) { '--self-contained' } else { '--no-self-contained' })
          dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $zip = if ($sc) { 'EngineBattle-Desktop-${{ matrix.rid }}.zip' }
                 else { 'EngineBattle-Desktop-${{ matrix.rid }}-framework-dependent.zip' }
          Compress-Archive -Path publish/shell/* -DestinationPath $zip
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=$zip"
        id: pack
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: ${{ steps.pack.outputs.zip }}

  release:
    # Deliberately not gated on desktop-shell: the Windows shell is a secondary artifact and
    # must never block the cross-platform release. A failure there still turns the run red,
    # it just ships without the shell zip.
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/EngineBattle-*.zip
